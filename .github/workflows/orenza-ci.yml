name: Orenza CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.12.4 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Start production server
        run: pnpm start > /tmp/orenza-next.log 2>&1 &

      - name: Wait for production server
        run: node -e "const wait=async()=>{for(let i=0;i<30;i++){try{const r=await fetch('http://127.0.0.1:3000/');if(r.ok)process.exit(0)}catch{} await new Promise(r=>setTimeout(r,1000))}process.exit(1)};wait()"

      - name: E2E smoke tests
        run: pnpm run e2e:smoke
