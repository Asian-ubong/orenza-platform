name: ORENZA Admin Android CI

on:
  push:
    branches: [main]
    paths:
      - 'app/admin/**'
      - 'app/api/admin/**'
      - 'app/api/auth/**'
      - 'components/admin/**'
      - 'lib/**'
      - 'public/**'
      - 'admin-capacitor.config.ts'
      - 'scripts/admin-build.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/admin-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orenza-admin-android-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  JAVA_VERSION: '21'

jobs:
  validate-web:
    name: Admin web validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install pnpm
        run: corepack prepare pnpm@10.12.4 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript typecheck
        run: pnpm run typecheck
      - name: Production build
        run: pnpm run build
      - name: Start production server
        run: pnpm start > /tmp/orenza-admin-next.log 2>&1 &
      - name: Wait for production server
        run: node -e "const wait=async()=>{for(let i=0;i<45;i++){try{const r=await fetch('http://127.0.0.1:3000/admin',{redirect:'manual'});if([200,301,302,307,308,401,403].includes(r.status))process.exit(0)}catch{} await new Promise(r=>setTimeout(r,1000))}process.exit(1)};wait()"
      - name: Admin route smoke
        run: node -e "const p=['/admin','/admin/dashboard','/admin/users','/admin/build-tracker']; const f=async()=>{for(const x of p){const r=await fetch('http://127.0.0.1:3000'+x,{redirect:'manual'}); if(![200,301,302,307,308,401,403].includes(r.status)) throw new Error(x+' returned '+r.status); console.log(x,r.status)}};f().catch(e=>{console.error(e);process.exit(1)})"
      - name: Upload web log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orenza-admin-web-log-${{ github.run_id }}
          path: /tmp/orenza-admin-next.log
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Dedicated Admin Android build
    needs: validate-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install pnpm
        run: corepack prepare pnpm@10.12.4 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Generate isolated Admin Android project
        run: pnpm run admin:build
      - name: Enforce Admin application identity
        run: |
          set -euo pipefail
          test -d android-admin/app
          grep -R "com.orenzatech.orenza.admin" android-admin/app/src android-admin/app/build.gradle* android-admin/variables.gradle* 2>/dev/null | head -n 20
          ! grep -R "com.orenzatech.orenza[^.]*$\|com.orenzatech.orenza'" android-admin/app/src android-admin/app/build.gradle* 2>/dev/null || true
      - name: Build debug APK
        working-directory: android-admin
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Build release APK and AAB
        working-directory: android-admin
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease
      - name: Validate APK and AAB outputs
        run: |
          set -euo pipefail
          debug_apk=$(find android-admin/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          release_apk=$(find android-admin/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          release_aab=$(find android-admin/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)
          test -s "$debug_apk"
          test -s "$release_apk"
          test -s "$release_aab"
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --verbose "$debug_apk"
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --verbose "$release_apk"
          mkdir -p artifacts
          cp "$debug_apk" artifacts/orenza-admin-debug.apk
          cp "$release_apk" artifacts/orenza-admin-release-unsigned.apk
          cp "$release_aab" artifacts/orenza-admin-release-unsigned.aab
          sha256sum artifacts/* > artifacts/orenza-admin.sha256
      - name: Upload Admin Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orenza-admin-android-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  e2e-admin:
    name: Admin Android emulator E2E
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Admin Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: orenza-admin-android-${{ github.sha }}
          path: artifacts
      - name: Verify artifact checksum
        run: sha256sum -c artifacts/orenza-admin.sha256
      - name: Admin APK emulator end-to-end smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -eu
            adb start-server
            adb wait-for-device
            i=1
            while [ "$i" -le 90 ]; do
              state="$(adb get-state 2>/dev/null || true)"
              if [ "$state" = "device" ]; then break; fi
              adb reconnect offline || true
              sleep 2
              i=$((i + 1))
            done
            test "$(adb get-state)" = "device"
            i=1
            while [ "$i" -le 60 ]; do
              boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$boot" = "1" ]; then break; fi
              sleep 2
              i=$((i + 1))
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb install --no-streaming -r artifacts/orenza-admin-debug.apk
            adb shell pm path com.orenzatech.orenza.admin
            adb shell monkey -p com.orenzatech.orenza.admin 1
            sleep 10
            adb shell pidof com.orenzatech.orenza.admin
            adb shell dumpsys package com.orenzatech.orenza.admin | grep -E 'versionName|versionCode'
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp'
            adb install --no-streaming -r artifacts/orenza-admin-debug.apk
            adb shell pidof com.orenzatech.orenza.admin || true
            adb shell am force-stop com.orenzatech.orenza.admin
            ! adb shell pidof com.orenzatech.orenza.admin

  finalize:
    name: Admin release gate
    if: ${{ always() }}
    needs: [validate-web, android, e2e-admin]
    runs-on: ubuntu-latest
    steps:
      - name: End-to-end green gate
        run: |
          set -euo pipefail
          test "${{ needs.validate-web.result }}" = success
          test "${{ needs.android.result }}" = success
          test "${{ needs.e2e-admin.result }}" = success
          echo "ORENZA Admin: web -> navigation -> auth boundary -> dashboard -> APK -> upgrade install -> E2E VERIFIED"
