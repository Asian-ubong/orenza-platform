name: Orenza Vercel Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: orenza-production
  cancel-in-progress: true

env:
  PRODUCTION_URL: https://orenza-platform.vercel.app

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production deployment
        run: |
          set -euo pipefail
          echo "Checking ${PRODUCTION_URL}"
          status=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "${PRODUCTION_URL}/")
          echo "HTTP status: ${status}"
          case "${status}" in
            2*) ;;
            3*) echo "Unexpected redirect status from production"; exit 1 ;;
            *) echo "Production health check failed"; exit 1 ;;
          esac

      - name: Verify critical routes
        run: |
          set -euo pipefail
          routes=(
            /private-access
            /provider-login
            /security-check
            /sandbox
            /markets
            /ai-premium
            /trade
            /trade/confirm
            /portfolio
            /wallet
            /profit-units
            /payout
            /payout/security
            /payout-history
            /activity
            /settings
            /announcements
            /events
            /videos
            /verify
            /api/version
          )
          for route in "${routes[@]}"; do
            status=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 30 "${PRODUCTION_URL}${route}")
            echo "${route}: ${status}"
            case "${status}" in
              2*) ;;
              *) echo "Route check failed: ${route}"; exit 1 ;;
            esac
          done

      - name: Verify anonymous admin protection
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${PRODUCTION_URL}/admin")
          echo "/admin: ${status}"
          case "${status}" in
            301|302|303|307|308|401|403|503) ;;
            *) echo "Admin route may be anonymously exposed"; exit 1 ;;
          esac
